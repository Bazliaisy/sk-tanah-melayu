<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SK Tanah Melayu</title>
  <link rel="stylesheet" href="style.css">

  <!-- Lightbox2 CSS & JS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/css/lightbox.min.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lightbox2/2.11.4/js/lightbox.min.js" defer></script>
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <a href="index.html">
        <img src="gambar/logo.png" alt="SK Tanah Melayu Logo">
      </a>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html" class="active">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <span class="hero-tag" data-animate="fade-down">Official Roblox Roleplay Experience</span>
        <h2 data-animate="fade-up" data-delay="1">Welcome to SK Tanah Melayu</h2>
        <p data-animate="fade-up" data-delay="2">Nurturing an excellent, distinguished, and illustrious generation.</p>
        <a href="about.html" class="btn" data-animate="fade-up" data-delay="3">Learn More</a>
      </div>
    </section>

    <section class="update-section">
      <h2 data-animate="fade-up">Latest Updates</h2>
      <ul class="update-list">
        <li data-animate="scale-up" data-delay="1">-</li>
        <li data-animate="scale-up" data-delay="2">-</li>
        <li data-animate="scale-up" data-delay="3">-</li>
      </ul>
    </section>

    <section class="galeri-section">
      <h2 data-animate="fade-up">SK Tanah Melayu Gallery</h2>
      <div class="galeri-grid">
        <a href="gambar/1.png" data-lightbox="galeri" data-title="Activity 1" data-animate="zoom-in" data-delay="1">
          <img src="gambar/1.png" alt="Activity 1">
        </a>
        <a href="gambar/2.png" data-lightbox="galeri" data-title="Activity 2" data-animate="zoom-in" data-delay="2">
          <img src="gambar/2.png" alt="Activity 2">
        </a>
        <a href="gambar/3.png" data-lightbox="galeri" data-title="Activity 3" data-animate="zoom-in" data-delay="3">
          <img src="gambar/3.png" alt="Activity 3">
        </a>
        <a href="gambar/4.png" data-lightbox="galeri" data-title="Activity 4" data-animate="zoom-in" data-delay="4">
          <img src="gambar/4.png" alt="Activity 4">
        </a>
        <a href="gambar/5.png" data-lightbox="galeri" data-title="Activity 5" data-animate="zoom-in" data-delay="5">
          <img src="gambar/5.png" alt="Activity 5">
        </a>
        <a href="gambar/image-11.png" data-lightbox="galeri" data-title="Activity 6" data-animate="zoom-in" data-delay="6">
          <img src="gambar/image-11.png" alt="Activity 6">
        </a>
      </div>
    </section>
  </main>

  <footer data-animate="fade-up">
    <p>&copy; 2025 SK Tanah Melayu. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
